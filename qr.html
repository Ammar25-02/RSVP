<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RSVP QR Codes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .wrap { max-width: 980px; }
    .tools { max-width: 620px; margin: 0 auto; }
    .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
    textarea { min-height: 160px; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row .btn { flex: 1 1 160px; width: auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 32px;
    }
    .qr-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 20px 16px;
      text-align: center;
      break-inside: avoid;
    }
    .qr-card .couple { font-family: var(--serif); font-size: 20px; margin: 0; }
    .qr-card .guest { font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--accent-dark); margin: 2px 0 12px; min-height: 1.2em; }
    .qr-box { display: inline-block; padding: 8px; background: #fff; }
    .qr-box img, .qr-box canvas { display: block; width: 168px; height: 168px; }
    .qr-card .seats { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
    .qr-card .scan { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 10px 0 0; }
    .qr-actions { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
    .qr-actions a, .qr-actions button {
      font: inherit; font-size: 12px; color: var(--accent-dark); background: none;
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; text-decoration: none;
    }
    .count { text-align: center; color: var(--muted); font-size: 14px; margin-top: 24px; word-break: break-all; }
    @media screen { .qr-card.copy { display: none; } .grid { grid-template-columns: minmax(220px, 280px); justify-content: center; } }

    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .wrap { padding: 0; max-width: none; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0; }
      .qr-card { border: 1px dashed #bbb; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="tools no-print">
      <section class="hero" style="padding-bottom:0">
        <p class="eyebrow">Host tools</p>
        <h1 class="names" style="font-size:44px">QR Codes</h1>
        <p class="greeting">One QR code for all guests. Print it on your cards or download the image to put on your invitation design.</p>
      </section>

      <section class="card">
        <div class="field">
          <label for="baseUrl">Invitation URL</label>
          <input type="url" id="baseUrl" placeholder="https://yourname.github.io/wedding-rsvp/">
          <p class="hint">Your GitHub Pages address. Filled in automatically once this page is live.</p>
        </div>

        <div class="field">
          <label for="copies">Copies to print</label>
          <select id="copies">
            <option value="1">1</option>
            <option value="6">6</option>
            <option value="9" selected>9 (one A4 page)</option>
            <option value="18">18</option>
          </select>
        </div>

        <div class="row">
          <button class="btn" type="button" id="genBtn">Generate QR code</button>
          <button class="btn ghost" type="button" id="printBtn">Print / Save as PDF</button>
        </div>
      </section>
    </div>

    <p class="count no-print" id="count"></p>
    <section class="grid" id="grid"></section>
  </main>

  <script>
  (function () {
    var W = window.WEDDING || {};
    function $(id) { return document.getElementById(id); }

    // Default base URL = the folder this page is served from
    var here = location.href.split("#")[0].split("?")[0].replace(/qr\.html$/, "");
    $("baseUrl").value = location.protocol.indexOf("http") === 0 ? here : "";

    var generated = false;

    function generate() {
      var url = $("baseUrl").value.trim();
      if (!url) { alert("Please enter your invitation URL first."); $("baseUrl").focus(); return; }
      if (!/^https?:\/\//i.test(url)) url = "https://" + url;

      var copies = parseInt($("copies").value, 10) || 1;
      var grid = $("grid");
      grid.innerHTML = "";
      generated = true;

      for (var n = 0; n < copies; n++) (function (first) {
        var card = document.createElement("div");
        card.className = "qr-card";

        var couple = document.createElement("p");
        couple.className = "couple";
        couple.textContent = (W.partner1 || "") + " & " + (W.partner2 || "");
        var guest = document.createElement("p");
        guest.className = "guest";
        guest.textContent = W.dateText || "You're invited";
        var box = document.createElement("div");
        box.className = "qr-box";
        card.appendChild(couple);
        card.appendChild(guest);
        card.appendChild(box);

        var scan = document.createElement("p");
        scan.className = "scan";
        scan.textContent = "Scan to RSVP";
        card.appendChild(scan);

        new QRCode(box, { text: url, width: 336, height: 336, correctLevel: QRCode.CorrectLevel.M });

        if (first) {
          var actions = document.createElement("div");
          actions.className = "qr-actions no-print";
          var dl = document.createElement("button");
          dl.type = "button";
          dl.textContent = "Download PNG";
          dl.addEventListener("click", function () {
            var canvas = box.querySelector("canvas");
            var a = document.createElement("a");
            a.href = canvas.toDataURL("image/png");
            a.download = "rsvp-qr.png";
            a.click();
          });
          var open = document.createElement("a");
          open.href = url; open.target = "_blank"; open.rel = "noopener";
          open.textContent = "Open link";
          actions.appendChild(dl);
          actions.appendChild(open);
          card.appendChild(actions);
        } else {
          card.classList.add("copy");
        }

        grid.appendChild(card);
      })(n === 0);

      $("count").textContent = "Link: " + url;
    }

    $("genBtn").addEventListener("click", generate);
    $("copies").addEventListener("change", function () { if (generated) generate(); });
    $("printBtn").addEventListener("click", function () { if (!generated) generate(); window.print(); });

    if ($("baseUrl").value) generate();
  })();
  </script>
</body>
</html>
